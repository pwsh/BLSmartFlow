; BLSmartFlow 2.0 - PlatformIO project configuration
;
; The device firmware targets the pioarduino ESP32 platform (Arduino-ESP32 3.3.x).
; A second, host-native environment builds only the Unity tests for the pure
; C++ fan-curve module (src/blflow/curve.h has no Arduino dependencies).

[platformio]
; NOTE: no build_dir override - the pioarduino builder's elf2image step fails
; when $BUILD_DIR is relocated out of .pio/build.
default_envs = esp32dev

[env:esp32dev]
custom_project_name = BLSmartflow
custom_version = 2.0.3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; min_spiffs: 1.875 MB per OTA slot, ~128 KB LittleFS. Our config file is < 4 KB.
board_build.partitions = min_spiffs.csv
build_flags =
	-DSTRVERSION=\"${this.custom_version}\"
	-DCORE_DEBUG_LEVEL=0
	; 4 kB is too tight once a handler saves the config (LittleFS) or
	; serialises the status document.
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DBLSF_SSDP
extra_scripts =
	pre:pre_build.py
	merge_firmware.py
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
	knolleary/PubSubClient@^2.8
	ESP32Async/ESPAsyncWebServer@^3.12.0
	ESP32Async/AsyncTCP@^3.5.0
	https://github.com/luc-github/ESP32SSDP.git#2.0.3

; Host-native unit tests: only test/ is compiled, against the Arduino-free curve.h.
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_src_filter = -<*>
build_flags =
	-std=gnu++17
	-I src/blflow
lib_deps =
	bblanchon/ArduinoJson@^7.4.3

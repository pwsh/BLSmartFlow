name: Docs

on:
  push:
    branches: ["rework-2.0", "main"]
    paths:
      - "site/**"
      - "mkdocs.yml"
      - "firmware/manifest.json"
      - "firmware/esp32dev/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install --upgrade mkdocs-material

      - name: Build site
        run: mkdocs build --strict

      # The web-flasher page needs the manifest and the image it references on the
      # same origin as the site (ESP Web Tools fetches them from the browser).
      - name: Publish firmware image next to the site
        run: |
          python3 - <<'PY'
          import json, os, shutil
          m = json.load(open("firmware/manifest.json"))
          out = "build/site/firmware"
          os.makedirs(os.path.join(out, "esp32dev"), exist_ok=True)
          for build in m["builds"]:
              for part in build["parts"]:
                  src = os.path.join("firmware", part["path"])
                  shutil.copy(src, os.path.join(out, part["path"]))
                  shutil.copy(src, os.path.join(out, "latest.bin"))
                  print("published", src)
          json.dump(m, open(os.path.join(out, "manifest.json"), "w"), indent=2)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
